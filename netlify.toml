[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# API Routes - specific routes first, then general
[[redirects]]
  from = "/api/specialties"
  to = "/.netlify/functions/specialties"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/doctors/:id/slots"
  to = "/.netlify/functions/slots"
  status = 200

[[redirects]]
  from = "/api/doctors/:id/schedule"
  to = "/.netlify/functions/schedules"
  status = 200

[[redirects]]
  from = "/api/doctors/:id/booking-fields"
  to = "/.netlify/functions/booking-fields"
  status = 200

[[redirects]]
  from = "/api/doctors/:id"
  to = "/.netlify/functions/doctors"
  status = 200

[[redirects]]
  from = "/api/doctors"
  to = "/.netlify/functions/doctors"
  status = 200

[[redirects]]
  from = "/api/appointments/:id"
  to = "/.netlify/functions/appointments"
  status = 200

[[redirects]]
  from = "/api/appointments"
  to = "/.netlify/functions/appointments"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Dev settings for netlify dev (optional)
[dev]
  targetPort = 5173
